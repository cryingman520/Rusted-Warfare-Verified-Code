# Rusted Warfare 1.15
# 目标引用与行动目标分离的最小示例
#
# 目的：演示为什么应该把“逻辑上的保护目标”保存在 customTarget1，
# 而不是把 activeWaypointTarget 当作永久目标变量。

[hiddenAction_setTarget]
# thisActionTarget 是本次 Action 的目标单位引用。
# 将它保存为长期逻辑目标。
setCustomTarget1: thisActionTarget

[hiddenAction_checkTarget]
# customTarget1 是单位引用。
# 这里仅判断引用是否存在；真正的“是否应该维修/跟随”应另外判断。
autoTrigger: if self.customTarget1 != nullUnit

[hiddenAction_clearTarget]
# 当保护任务明确结束时，再主动清空逻辑目标。
setCustomTarget1: nullUnit

[hiddenAction_checkActiveActionTarget]
# activeWaypointTarget 代表当前主动行动所使用的目标。
# 它可能因攻击、维修、运输等行动发生改变，因此不要把它当永久保护目标。
autoTrigger: if self.activeWaypointTarget != nullUnit
