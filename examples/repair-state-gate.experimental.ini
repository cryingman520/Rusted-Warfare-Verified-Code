# Rusted Warfare 1.15
# EXPERIMENTAL：维修状态机骨架
#
# 注意：这个文件不是“已经验证成功的护盾维修工程师”。
# 它只记录我们从此前测试中确定的状态机原则。

[hiddenAction_shouldRepair]
# 关键原则：不能只判断 hp。
# 如果 hp 已满但 shield 未满，仍然应该允许进入维修状态。
# 下面的表达式只作为状态机示意，具体 shield 条件必须结合你的目标单位和实际版本测试。
#
# 不要把这一段直接视为最终可用的护盾维修实现。

[hiddenAction_keepProtectedTarget]
# 保护目标应当存放在 customTarget1 中。
# 不要因为一次维修动作结束，就把保护目标引用自动清掉。
# 否则容易出现“维修结束 -> 保护目标丢失 -> 工程师停止跟随”。

[hiddenAction_reacquireAction]
# 如果当前维修行动被打断，应根据 customTarget1 重新决定下一行动。
# 这里刻意不提供未经验证的 repair action 参数，避免把推测写成事实。

# 当前结论：
# 1. 保护目标生命周期和当前维修行动生命周期必须分开。
# 2. hp 满不能作为“目标已经修好”的唯一条件。
# 3. 不要在每个 autoTrigger 周期无条件重发维修/跟随命令。
# 4. 护盾维修最终实现仍需在 Rusted Warfare 1.15 实机继续验证。
