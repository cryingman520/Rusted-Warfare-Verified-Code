# 原创教学单位，基于指定 Android 1.15 包的解析器静态核对。
# 注释使用独立行。不要将整份手册当成 INI 导入。

[core]
# 唯一内部名称；显示名称可以与它不同。
name: rwDocScout
class: CustomUnitMetadata
# 加强重复键等加载校验。
strictLevel: 1
# 资金价格、生命、质量和碰撞半径。
price: 300
maxHp: 220
mass: 2000
radius: 11
# 建造基础用时；实际工厂倍率仍会影响用时。
buildSpeed: 8s
techLevel: 1
# 沙盒列表入口。
showInEditor: true
displayText: 注释侦察车
displayDescription: 对地测试单位\n按钮切换弹种，开火时记录射击次数
# 将此单位添加到内置陆军工厂菜单。
builtFrom_1_name: landFactory
builtFrom_1_pos: 90
# number 是数值类型，boolean 是布尔类型。
defineUnitMemory: number shots, boolean powered

[graphics]
# 该文件已在目标包 assets/units/shared 中确认存在。
image: SHARED:debug_marker.png
total_frames: 1
# 不需要残骸和额外阴影图片。
image_wreak: NONE
image_shadow: NONE

[attack]
# 总体攻击能力与三种目标分类。
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 150
# 时间字段接受 s；这是一次射击间隔。
shootDelay: 1s
turretSize: 6
turretTurnSpeed: 3

[turret_main]
# 炮塔位置相对单位中心。
x: 0
y: 0
# 引用 [projectile_shell] 时只写后缀 shell。
projectile: shell
# powered 为真时使用另一个已经定义的射弹。
altProjectile: poweredShell
altProjectileCondition: memory.powered
# 每次开火执行隐藏动作；值是动作名，不是 bool。
onShoot_triggerActions: countShot

[projectile_shell]
# 普通弹：直接伤害 18。
directDamage: 18
# life 是时间读取器，1.5s 对应约 90 帧。
life: 1.5s
speed: 4
drawSize: 1
color: #FFE1B0

[projectile_poweredShell]
# 另一种弹药，用伤害与颜色变化演示模式切换。
directDamage: 30
life: 1.5s
speed: 4
drawSize: 1.3
color: #80D8FF

[movement]
# 移动类型是枚举，不能写任意中文名称。
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 3
turnAcceleration: 0.3

[hiddenAction_initialize]
# 出生事件只负责初始化，避免依赖隐式缺省值。
autoTriggerOnEvent: created
setUnitMemory: shots=0, powered=false

[hiddenAction_countShot]
# 内存写入不支持 +=，使用读取旧值再赋值。
setUnitMemory: shots=memory.shots + 1

[action_toggleMode]
# 动态文本中的 %{...} 在运行时读取内存。
text: 切换弹种；已射击 %{memory.shots} 次
description: 切换普通弹与加强弹。此教学模式不收取资源。
buildSpeed: 0
# 反转布尔值；炮塔会读取新状态选择弹种。
setUnitMemory: powered=not memory.powered
