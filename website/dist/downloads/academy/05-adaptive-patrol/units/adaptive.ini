# 应急战车 / Adaptive Tank / rwa05AdaptiveTank
# 单位核心 / Core settings
[core]
name: rwa05AdaptiveTank
class: CustomUnitMetadata
strictLevel: 1
displayText: 应急战车 / Adaptive Tank
price: 700
maxHp: 600
mass: 2000
radius: 11
buildSpeed: 8s
techLevel: 1
showInEditor: true
defineUnitMemory: boolean emergency
autoTriggerCooldownTime: 0.25s
# 主体图片与炮塔图片分开 / Separate body and turret sprites
[graphics]
image: body.png
image_turret: turret.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1

# 允许攻击地面目标 / Ground targets only
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 150
shootDelay: 1s
turretSize: 6
turretTurnSpeed: 3

[turret_main]
x: 0
y: 0
projectile: shell
altProjectile: emergency
altProjectileCondition: memory.emergency
[projectile_shell]
directDamage: 18
life: 1.5s
speed: 4
drawSize: 1
color: #FFE1B0

[movement]
movementType: LAND
moveSpeed: 0.7
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 3
turnAcceleration: 0.3

[projectile_emergency]
directDamage: 30
life: 1.5s
speed: 4
drawSize: 1.2
color: #FF9B72

[hiddenAction_initialize]
autoTriggerOnEvent: created
setUnitMemory: emergency=false

[hiddenAction_enterEmergency]
autoTrigger: if self.hp < self.maxHp * 0.5 and not memory.emergency
setUnitMemory: emergency=true
setUnitStats: movespeed=1.2
showMessageToPlayer: 应急模式开启 / Emergency mode enabled

[hiddenAction_leaveEmergency]
autoTrigger: if self.hp >= self.maxHp * 0.8 and memory.emergency
setUnitMemory: emergency=false
setUnitStats: movespeed=0.7
showMessageToPlayer: 已恢复巡航 / Cruise mode restored

[action_status]
text: 查看状态 / Inspect state
description: 应急状态 / Emergency: %{memory.emergency}
buildSpeed: 0
showMessageToPlayer: HP %{self.hp} / %{self.maxHp}

