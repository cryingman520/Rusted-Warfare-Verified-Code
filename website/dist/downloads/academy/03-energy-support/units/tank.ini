# 蓄能战车 / Capacitor Tank / rwa03EnergyTank
# 单位核心 / Core settings
[core]
name: rwa03EnergyTank
class: CustomUnitMetadata
strictLevel: 1
displayText: 蓄能战车 / Capacitor Tank
price: 650
maxHp: 240
mass: 2000
radius: 11
buildSpeed: 8s
techLevel: 1
showInEditor: true
energyMax: 12
energyStartingPercentage: 1
energyRegen: 0.03
# 主体图片与炮塔图片分开 / Separate body and turret sprites
[graphics]
image: body.png
image_turret: turret.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1

# 允许攻击地面目标 / Ground targets only
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 150
shootDelay: 0.8s
turretSize: 6
turretTurnSpeed: 3

[turret_main]
x: 0
y: 0
projectile: shell
energyUsage: 2
[projectile_shell]
directDamage: 42
life: 1.5s
speed: 4
drawSize: 1
color: #FFE1B0

[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 3
turnAcceleration: 0.3

