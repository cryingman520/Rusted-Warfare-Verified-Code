# 研究战车 / Research Rover / rwa04Rover
# 单位核心 / Core settings
[core]
name: rwa04Rover
class: CustomUnitMetadata
strictLevel: 1
displayText: 研究战车 / Research Rover
price: 500
maxHp: 240
mass: 2000
radius: 11
buildSpeed: 8s
techLevel: 1
showInEditor: true
defineUnitMemory: boolean upgraded
# 主体图片与炮塔图片分开 / Separate body and turret sprites
[graphics]
image: body.png
image_turret: turret.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1

# 允许攻击地面目标 / Ground targets only
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 150
shootDelay: 1s
turretSize: 6
turretTurnSpeed: 3

[turret_main]
x: 0
y: 0
projectile: shell
altProjectile: enhanced
altProjectileCondition: memory.upgraded
[projectile_shell]
directDamage: 18
life: 1.5s
speed: 4
drawSize: 1
color: #FFE1B0

[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 3
turnAcceleration: 0.3

[global_resource_l04data]
displayName: 研究数据 / Research Data
displayInHud: true

[projectile_enhanced]
directDamage: 36
life: 1.5s
speed: 4
drawSize: 1.2
color: #9EE5B1

[hiddenAction_initialize]
autoTriggerOnEvent: created
setUnitMemory: upgraded=false

[action_upgrade]
text: 装填改良弹 / Improve ammunition
description: 消耗一份数据 / Costs one data
price: l04data=1
buildSpeed: 1s
isLocked: if memory.upgraded
isLockedMessage: 已完成改良 / Already upgraded
requireConditional: if not memory.upgraded
setUnitMemory: upgraded=true

