[core]
name: rwa07Carrier
class: CustomUnitMetadata
strictLevel: 1
displayText: 指挥运输车 / Command Carrier
price: 650
maxHp: 550
mass: 3500
radius: 13
buildSpeed: 12s
techLevel: 1
showInEditor: true
tags: v07carrier
defineUnitMemory: number signals
maxTransportingUnits: 2
transportUnitsRequireTag: v07cargo
transportUnitsRequireMovementType: LAND
transportUnitsEachUnitAlwaysUsesSingleSlot: true
transportUnitsAddUnloadOption: true
transportUnitsUnloadDelayBetweenEachUnit: 1s

[graphics]
image: carrier.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[movement]
movementType: LAND
moveSpeed: 0.7
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.06
maxTurnSpeed: 2.5
turnAcceleration: 0.25

[resource_v07cells]
displayName: 车载补给 / Onboard supplies
displayInHud: false

[global_resource_v07stock]
displayName: 车队储备 / Fleet stock
displayInHud: true

# 每辆车独立记忆和库存 / Per-vehicle memory and inventory
[hiddenAction_initialize]
autoTriggerOnEvent: created
setUnitMemory: signals=0
addResources: v07cells=3

# 转换队伍资源 / Convert team resources
[action_buyStock]
text: 采购一份储备 / Buy one stock
price: credits=100
buildSpeed: 2s
addResources: v07stock=1

[action_reload]
text: 领取三份车载补给 / Load three supplies
price: v07stock=1
buildSpeed: 2s
addResources: v07cells=3

[action_useSupply]
text: 使用一份补给 / Use one supply
price: v07cells=1
buildSpeed: 1s
showMessageToPlayer: Supply used

# 挂载设备与车体分工 / Separate pod and carrier responsibilities
[attachment_radio]
x: 0
y: -3
height: 1
onCreateSpawnUnitOf: rwa07Radio
showAllActionsFrom: true
isUnselectable: true
canBeAttackedAndDamaged: false
lockRotation: true
setDrawLayerOnTop: true

[hiddenAction_receiveSignal]
autoTriggerOnEvent: newMessage(withTag='v07signal')
setUnitMemory: signals=memory.signals + eventData(name='pulse',type='number',default=0)
showMessageToPlayer: Signal count: %{memory.signals}

[action_report]
text: 查看车队状态 / Fleet status
buildSpeed: 0
showMessageToPlayer: Signals=%{memory.signals}, supplies=%{self.resource.v07cells}, fleet stock=%{self.resource.v07stock}, passengers=%{self.transportingCount}
