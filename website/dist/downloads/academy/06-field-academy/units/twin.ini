# 双炮护卫车 / Twin Guard / rwa06Twin
# 单位核心 / Core settings
[core]
name: rwa06Twin
class: CustomUnitMetadata
strictLevel: 1
displayText: 双炮护卫车 / Twin Guard
price: 800
maxHp: 550
mass: 2000
radius: 11
buildSpeed: 8s
techLevel: 1
showInEditor: true

# 主体图片与炮塔图片分开 / Separate body and turret sprites
[graphics]
image: heavy.png
image_turret: turret.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1

# 允许攻击地面目标 / Ground targets only
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 150
shootDelay: 1.2s
turretSize: 6
turretTurnSpeed: 3

[turret_main]
x: -7
y: 0
projectile: shell

[projectile_shell]
directDamage: 24
life: 1.5s
speed: 4
drawSize: 1
color: #FFE1B0

[movement]
movementType: LAND
moveSpeed: 0.65
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 3
turnAcceleration: 0.3

[turret_second]
x: 7
y: 0
projectile: shell
delay: 1.2s

