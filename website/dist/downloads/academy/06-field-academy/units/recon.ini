# 学院侦察车 / Academy Recon / rwa06Recon
# 单位核心 / Core settings
[core]
name: rwa06Recon
class: CustomUnitMetadata
strictLevel: 1
displayText: 学院侦察车 / Academy Recon
price: 250
maxHp: 200
mass: 2000
radius: 11
buildSpeed: 8s
techLevel: 1
showInEditor: true
defineUnitMemory: number shots
# 主体图片与炮塔图片分开 / Separate body and turret sprites
[graphics]
image: body.png
image_turret: turret.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1

# 允许攻击地面目标 / Ground targets only
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 150
shootDelay: 1s
turretSize: 6
turretTurnSpeed: 3

[turret_main]
x: 0
y: 0
projectile: shell
onShoot_triggerActions: record
[projectile_shell]
directDamage: 14
life: 1.5s
speed: 4
drawSize: 1
color: #FFE1B0

[movement]
movementType: LAND
moveSpeed: 1.2
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 3
turnAcceleration: 0.3

[hiddenAction_initialize]
autoTriggerOnEvent: created
setUnitMemory: shots=0

[hiddenAction_record]
alsoTriggerAction: increment

[hiddenAction_increment]
setUnitMemory: shots=memory.shots + 1

[action_report]
text: 查看射击统计 / Shot report
buildSpeed: 0
showMessageToPlayer: Shots: %{memory.shots}

