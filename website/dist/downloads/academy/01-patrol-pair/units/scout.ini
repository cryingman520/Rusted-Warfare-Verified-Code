# 巡逻侦察车 / Patrol Scout / rwa01Scout
# 单位核心 / Core settings
[core]
name: rwa01Scout
class: CustomUnitMetadata
strictLevel: 1
displayText: 巡逻侦察车 / Patrol Scout
price: 250
maxHp: 200
mass: 2000
radius: 11
buildSpeed: 8s
techLevel: 1
showInEditor: true

# 主体图片与炮塔图片分开 / Separate body and turret sprites
[graphics]
image: body.png
image_turret: turret.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1

# 允许攻击地面目标 / Ground targets only
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 150
shootDelay: 1s
turretSize: 6
turretTurnSpeed: 3

[turret_main]
x: 0
y: 0
projectile: shell

[projectile_shell]
directDamage: 18
life: 1.5s
speed: 4
drawSize: 1
color: #FFE1B0

[movement]
movementType: LAND
moveSpeed: 1.2
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 3
turnAcceleration: 0.3

