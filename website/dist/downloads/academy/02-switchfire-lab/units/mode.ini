# 变弹侦察车 / Switchfire Scout / rwa02ModeScout
# 单位核心 / Core settings
[core]
name: rwa02ModeScout
class: CustomUnitMetadata
strictLevel: 1
displayText: 变弹侦察车 / Switchfire Scout
price: 400
maxHp: 240
mass: 2000
radius: 11
buildSpeed: 8s
techLevel: 1
showInEditor: true
defineUnitMemory: number shots, boolean powered
# 主体图片与炮塔图片分开 / Separate body and turret sprites
[graphics]
image: body.png
image_turret: turret.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1

# 允许攻击地面目标 / Ground targets only
[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 150
shootDelay: 1s
turretSize: 6
turretTurnSpeed: 3

[turret_main]
x: 0
y: 0
projectile: shell
altProjectile: powered
altProjectileCondition: memory.powered
onShoot_triggerActions: countShot
[projectile_shell]
directDamage: 18
life: 1.5s
speed: 4
drawSize: 1
color: #FFE1B0

[movement]
movementType: LAND
moveSpeed: 1
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.06
maxTurnSpeed: 3
turnAcceleration: 0.3

[projectile_powered]
directDamage: 30
life: 1.5s
speed: 4
drawSize: 1.3
color: #80D8FF

[hiddenAction_initialize]
autoTriggerOnEvent: created
setUnitMemory: shots=0, powered=false

[hiddenAction_countShot]
setUnitMemory: shots=memory.shots + 1

[action_toggle]
text: 切换弹种 / Switch ammo
description: 射击次数 / Shots: %{memory.shots}
buildSpeed: 0
setUnitMemory: powered=not memory.powered

