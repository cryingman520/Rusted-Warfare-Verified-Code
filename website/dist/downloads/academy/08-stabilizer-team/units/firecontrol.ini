[core]
name: rwa08Firecontrol
class: CustomUnitMetadata
strictLevel: 1
displayText: 稳定火控车 / Stabilizer
price: 550
maxHp: 350
mass: 3500
radius: 13
buildSpeed: 12s
techLevel: 1
showInEditor: true
tags: v08defender
defineUnitMemory: boolean focused

[graphics]
image: body.png
image_wreak: NONE
image_shadow: NONE
total_frames: 1
image_turret: turret.png

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 170
shootDelay: 1.4s
turretSize: 6
turretTurnSpeed: 3

[movement]
movementType: LAND
moveSpeed: 0.85
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.06
maxTurnSpeed: 2.5
turnAcceleration: 0.25

[turret_main]
x: 0
y: 0
projectile: normal
altProjectile: focused
altProjectileCondition: memory.focused
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
recoilOffset: -1.5
recoilOutTime: 3
recoilReturnTime: 9
shoot_flame: CUSTOM:signal

[projectile_normal]
directDamage: 20
life: 1.8s
speed: 4
drawSize: 1
color: #FBE0B0

[projectile_focused]
directDamage: 34
life: 1.8s
speed: 5
drawSize: 1.2
color: #8AE9D1

[hiddenAction_initialize]
autoTriggerOnEvent: created
setUnitMemory: focused=false

[action_focus]
text: 稳定射击 / Stabilize
buildSpeed: 0
isLocked: if memory.focused
requireConditional: if not memory.focused
setUnitMemory: focused=true
setUnitStats: movespeed=0.35
spawnEffects: CUSTOM:signal

[action_cruise]
text: 恢复巡航 / Resume cruise
buildSpeed: 0
isLocked: if not memory.focused
requireConditional: if memory.focused
setUnitMemory: focused=false
setUnitStats: movespeed=0.85

[action_status]
text: 查看射击状态 / Fire-control status
buildSpeed: 0
showMessageToPlayer: Stabilized=%{memory.focused}

[effect_signal]
image: glow.png
life: 24
alpha: 0.8
scaleFrom: 0.6
scaleTo: 1.5
fadeOut: true
attachedToUnit: false
color: #8AE9D1
priority: high

[animation_idlePulse]
onActions: idle
pingPong: true
body_0s: {scale:1}
body_1s: {scale:1.03}
